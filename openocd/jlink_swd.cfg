# OpenOCD 配置：SEGGER J-Link 调试器 + SWD 接口 + STM32H723
# 用法：openocd -f openocd/jlink_swd.cfg
# 注意：TCL 中 # 必须位于行首才是注释，不要写在命令参数后面

# ---------- 适配器 ----------
# 使用 J-Link 作为调试探针（依赖 libjlinkarm.so）
adapter driver jlink
# 接口选择 SWD（而非 JTAG）
transport select swd
# SWD 时钟 4 MHz，连接不稳定可改为 1000
adapter speed 4000

# 多个 J-Link 时取消注释并指定序列号
# jlink serial 123456789

# ---------- 目标芯片 ----------
source [find target/stm32h7x.cfg]

# 复位方式：当前板卡 NRST 未接到 J-Link，硬件复位会超时，故用软件复位
reset_config none

# 若已连接 NRST 引脚，注释上面一行，改用下面这行：
# reset_config srst_only srst_nogate
